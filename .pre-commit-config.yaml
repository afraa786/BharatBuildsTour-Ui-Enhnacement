repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^client/public/.*\.svg$
      - id: trailing-whitespace
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check server
        language: python
        additional_dependencies: [ruff==0.16.8]
        pass_filenames: false
        files: ^server/.*\.py$
      - id: ruff-format
        name: Ruff formatting
        entry: ruff format --check server
        language: python
        additional_dependencies: [ruff==0.16.8]
        pass_filenames: false
        files: ^server/.*\.py$
      - id: detect-secrets
        name: Detect committed secrets
        entry: detect-secrets-hook
        language: python
        additional_dependencies: [detect-secrets==1.5.0]
        files: ^(server/|client/|docs/|scripts/|[^/]+$)
        exclude: (^|/)\.env\.example$
