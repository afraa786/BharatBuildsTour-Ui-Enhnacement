name: stockaware

x-server-environment: &server-environment
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
  POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST in .env}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
  INTERNAL_BUSINESS_ID: ${INTERNAL_BUSINESS_ID:-}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
  RAZORPAY_PREVIOUS_WEBHOOK_SECRET: ${RAZORPAY_PREVIOUS_WEBHOOK_SECRET:-}
  RAZORPAY_ACCOUNT_ID: ${RAZORPAY_ACCOUNT_ID:-}
  ARTIFACT_DIR: /var/lib/stockaware/artifacts
  INVOICE_ARTIFACT_ROOT: /var/lib/stockaware/artifacts
  PUBLIC_ARTIFACT_BASE_URL: ${PUBLIC_ARTIFACT_BASE_URL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  WHATSAPP_BIZ_PHONE_NUMBER_ID: ${WHATSAPP_BIZ_PHONE_NUMBER_ID:-}
  WHATSAPP_BIZ_ACCESS_TOKEN: ${WHATSAPP_BIZ_ACCESS_TOKEN:-}
  WHATSAPP_BIZ_VERIFY_TOKEN: ${WHATSAPP_BIZ_VERIFY_TOKEN:-}
  WHATSAPP_TEST_PHONE_NUMBER_ID: ${WHATSAPP_TEST_PHONE_NUMBER_ID:-}
  WHATSAPP_TEST_ACCESS_TOKEN: ${WHATSAPP_TEST_ACCESS_TOKEN:-}
  WHATSAPP_TEST_VERIFY_TOKEN: ${WHATSAPP_TEST_VERIFY_TOKEN:-}
  ADMIN_WHATSAPP_NUMBERS: ${ADMIN_WHATSAPP_NUMBERS:-}
  VENDOR_WHATSAPP_NUMBERS: ${VENDOR_WHATSAPP_NUMBERS:-}

services:
  migrate:
    build:
      context: ./server
    environment: *server-environment
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  server:
    build:
      context: ./server
    environment: *server-environment
    volumes:
      - invoice_artifacts:/var/lib/stockaware/artifacts
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  invoice_artifacts:
